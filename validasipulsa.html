<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECRET WARS - Generator Validasi Pulsa</title>
    
    <!-- Memanggil CSS Utama Aplikasi -->
    <link rel="stylesheet" href="styles.css">

    <style>
        /* CSS Ringkas Bebas Scroll */
        body {
            overflow-y: hidden; /* Cegah scrollbar utama */
        }
        .main-content {
            padding: 12px 16px !important;
        }
        .wrapper {
            max-width: 100%;
        }
        .main-title {
            font-size: 18px !important;
            margin-bottom: 8px !important;
            margin-top: 0 !important;
        }
        .val-card-search {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .val-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: stretch;
        }
        .val-card {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .val-card-title {
            font-size: 11px;
            font-weight: 800;
            color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin: 0;
            text-transform: uppercase;
        }
        .val-input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .val-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .val-input, .val-select, .val-textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 6px 10px;
            color: #fff;
            font-size: 12px;
            box-sizing: border-box;
            outline: none;
        }
        .val-input:focus, .val-select:focus, .val-textarea:focus {
            border-color: #3b82f6;
        }
        .val-btn {
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .val-btn:hover { transform: translateY(-1px); }
        .val-btn-blue { background: #1565c0; color: #fff; }
        .val-btn-blue:hover { background: #1e88e5; }
        .val-btn-green { background: #059669; color: #fff; }
        .val-btn-green:hover { background: #10b981; }
        
        /* Teks Box Balasan Mitra Warna Putih */
        .report-output {
            background: #0f172a;
            color: #ffffff;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            height: 100%;
            min-height: 260px;
            resize: none;
        }
    </style>
</head>
<body>

    <!-- LAYOUT CONTAINER UTAMA -->
    <div class="layout-container">
        
        <!-- Sidebar Container -->
        <div class="sidebar"></div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="wrapper">
                
                <!-- Title Header -->
                <h1 class="main-title" style="color: #fbbf24; display: flex; align-items: center; gap: 6px;">
                    📱 GENERATOR VALIDASI MITRA
                </h1>

                <!-- Search Query Bar -->
                <div class="val-card-search">
                    <form onsubmit="handleQueryValidation(event)" style="display: flex; gap: 10px; align-items: flex-end;">
                        <div class="val-input-group" style="flex: 1;">
                            <label class="val-label">CARI DATA TRANSAKSI AUTOMATIS (BILL INFO 1 / NO. HP)</label>
                            <!-- KUNCI INPUT HANYA NUMERIK (ANGKA) -->
                            <input type="text" id="billInfoInput" class="val-input" required 
                                inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                placeholder="Masukkan No. HP / ID Pelanggan (Contoh: 083803760408)">
                        </div>
                        <button type="submit" class="val-btn val-btn-blue" style="height: 33px; white-space: nowrap;">
                            ⚡ Process & Generate Laporan
                        </button>
                    </form>
                </div>

                <!-- Main Form & Result Grid -->
                <div class="val-grid">
                    
                    <!-- PANEL INPUT PARAMETER -->
                    <div class="val-card">
                        <h2 class="val-card-title">⚙️ Parameter Validasi</h2>
                        
                        <div class="val-input-group">
                            <label class="val-label">1. PILIH CLUSTER / FORMAT VALIDASI</label>
                            <select id="clusterSelect" class="val-select" onchange="handleGenerate()">
                                <option value="MOBO_PULSA">MOBO INDOSAT/TRI (Pulsa Reguler)</option>
                                <option value="MOBO_PAKET">MOBO INDOSAT/TRI (Paket Data)</option>
                                <option value="TSEL_GIGA">TELKOMSEL GIGA</option>
                                <option value="XL_DOMPUL" selected>XL GIGA / DOMPUL</option>
                                <option value="MANDIRI_TOLM">TOL MANDIRI / E-MONEY</option>
                            </select>
                        </div>

                        <div class="val-input-group">
                            <label class="val-label">2. NO. HP / ID PELANGGAN</label>
                            <!-- KUNCI INPUT HANYA NUMERIK (ANGKA) -->
                            <input type="text" id="noHpInput" class="val-input" oninput="this.value = this.value.replace(/[^0-9]/g, ''); handleGenerate();"
                                inputmode="numeric" placeholder="Contoh: 085602887010 atau ID e-Money">
                        </div>

                        <!-- FIELD 3: KODE & DESKRIPSI PRODUK / NOMINAL -->
                        <div class="val-input-group">
                            <label class="val-label">3. KODE & DESKRIPSI PRODUK / NOMINAL</label>
                            <input type="text" id="paketInput" class="val-input" oninput="handleGenerate()" placeholder="Contoh: TDHAP11H - Happy 11GB 28 Hari / 20000">
                        </div>

                        <div class="val-input-group">
                            <label class="val-label">4. SN / TID / REF</label>
                            <input type="text" id="snInput" class="val-input" oninput="handleGenerate()" placeholder="Contoh: TKXL020807ABDF">
                        </div>

                        <div class="val-input-group">
                            <label class="val-label">5. WAKTU TRANSAKSI</label>
                            <input type="text" id="waktuInput" class="val-input" oninput="handleGenerate()" placeholder="DD-MM-YYYY HH:mm:ss">
                        </div>

                        <button type="button" onclick="handleGenerate()" class="val-btn val-btn-blue" style="margin-top: 2px;">
                            🔄 Update Teks Manual
                        </button>
                    </div>

                    <!-- PANEL OUTPUT TEKS BALASAN MITRA -->
                    <div class="val-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
                            <h2 class="val-card-title" style="border: none; padding: 0;">💬 Teks Balasan Mitra</h2>
                            
                            <!-- DUA TOMBOL: COPY TEXT & COPY IMAGE -->
                            <div style="display: flex; gap: 6px;">
                                <button type="button" onclick="copyReportText()" id="btnCopy" class="val-btn val-btn-green" style="padding: 4px 10px; font-size: 10px;">
                                    📋 Copy Text
                                </button>
                                <button type="button" onclick="copyReportImage()" id="btnCopyImg" class="val-btn val-btn-blue" style="padding: 4px 10px; font-size: 10px; background: #2563eb;">
                                    📷 Copy Image
                                </button>
                            </div>
                        </div>

                        <textarea id="reportResult" readonly class="val-input val-textarea report-output"
                            placeholder="Teks validasi untuk mitra akan muncul di sini..."></textarea>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- SCRIPT ENGINE & INTEGRASI BACKEND -->
    <script>
        let rawNominalFromDB = "";

        // Set Default Waktu Saat Ini
        function setCurrentTime() {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const d = pad(now.getDate());
            const m = pad(now.getMonth() + 1);
            const y = now.getFullYear();
            const hh = pad(now.getHours());
            const mm = pad(now.getMinutes());
            const ss = pad(now.getSeconds());
            document.getElementById('waktuInput').value = `${d}-${m}-${y} ${hh}:${mm}:${ss}`;
        }

        // FUNGSI KONVERSI NOMOR HP KETIKAN AWAL '0' MENJADI '62'
        function formatPhone62(numStr) {
            if (!numStr) return "-";
            let clean = numStr.trim().replace(/[^0-9]/g, '');
            if (clean.startsWith('0')) {
                return '62' + clean.substring(1);
            }
            return clean || numStr;
        }

        // FUNGSI PEMBERSIH & EKSTRAKSI NOMINAL MURNI (UNTUK PULSA REGULER)
        function getCleanNominal(inputText) {
            if (!inputText) return "-";
            let str = inputText.trim();

            if (/^\d+$/.test(str)) return str;

            if (rawNominalFromDB && str.includes(rawNominalFromDB)) {
                return rawNominalFromDB;
            }

            let matchDirect = str.match(/\b\d{4,6}\b/);
            if (matchDirect) return matchDirect[0];

            let matchK = str.match(/(\d+)\s*(k|rb|ribu)/i);
            if (matchK) return String(parseInt(matchK[1]) * 1000);

            let matchNum = str.match(/\d+/);
            if (matchNum) {
                let val = parseInt(matchNum[0]);
                if (val < 1000) return String(val * 1000);
                return String(val);
            }

            return rawNominalFromDB || str;
        }

        // FUNGSI EKSTRAKSI DESKRIPSI MURNI TANPA KODE PRODUK (UNTUK PAKET DATA)
        function getCleanDeskripsi(inputText) {
            if (!inputText) return "-";
            let str = inputText.trim();

            if (str.includes(' - ')) {
                let parts = str.split(' - ');
                parts.shift();
                return parts.join(' - ').trim();
            }

            return str;
        }

        // FUNGSI DETEKSI KATEGORI / CLUSTER TINGKAT TINGGI (DENGAN KATA KUNCI PAKET LENGKAP)
        function detectAndSetCluster(idProduk = '', deskripsi = '', noHp = '', deskripsiBiller = '', idBiller = '') {
            const textBiller = `${idBiller} ${deskripsiBiller}`.toUpperCase();
            const textProduk = `${idProduk} ${deskripsi}`.toUpperCase();
            const cleanHp = noHp.replace(/[^0-9]/g, '');

            // List Kata Kunci Lengkap Paket Data (Tri / Indosat)
            const paketKeywords = [
                'PAKET', 'GB', 'MB', 'DATA', 'HAPPY', 'AON', 'COMBO', 
                'UNLI', 'HARIAN', 'BULANAN', 'FREEDOM', 'MINI', 'GIGA', 
                'ALWAYS', 'BOOSTER', 'VOUCHER'
            ];
            const isPaketData = paketKeywords.some(kw => textProduk.includes(kw));

            let selectedCluster = "XL_DOMPUL";

            // LEVEL 1: DETEKSI BERDASARKAN BILLER
            if (textBiller.includes('TOL') || textBiller.includes('MANDIRI') || textProduk.includes('TOL') || textProduk.includes('E-MONEY') || textProduk.includes('EMONEY')) {
                selectedCluster = 'MANDIRI_TOLM';
            }
            else if (textBiller.includes('MOBO') || textBiller.includes('TRI') || textBiller.includes('THREE') || textBiller.includes('INDOSAT') || textBiller.includes('ISAT')) {
                selectedCluster = isPaketData ? 'MOBO_PAKET' : 'MOBO_PULSA';
            }
            else if (textBiller.includes('DOMPUL') || textBiller.includes('XL') || textBiller.includes('AXIS')) {
                selectedCluster = 'XL_DOMPUL';
            }
            else if (textBiller.includes('DIGIPOS') || textBiller.includes('TSEL') || textBiller.includes('TELKOMSEL')) {
                selectedCluster = 'TSEL_GIGA';
            }

            // LEVEL 2: DETEKSI BERDASARKAN KATA KUNCI PRODUK
            else if (textProduk.includes('TOL') || textProduk.includes('E-MONEY') || textProduk.includes('EMONEY')) {
                selectedCluster = 'MANDIRI_TOLM';
            }
            else if (textProduk.includes('MOBO') || textProduk.includes('TRI') || textProduk.includes('THREE') || textProduk.includes('INDOSAT') || textProduk.includes('ISAT')) {
                selectedCluster = isPaketData ? 'MOBO_PAKET' : 'MOBO_PULSA';
            } 
            else if (textProduk.includes('TSEL') || textProduk.includes('TELKOMSEL') || textProduk.includes('SIMGOLD')) {
                selectedCluster = 'TSEL_GIGA';
            } 
            else if (textProduk.includes('XL') || textProduk.includes('XR') || textProduk.includes('DOMPUL') || textProduk.includes('AXIS')) {
                selectedCluster = 'XL_DOMPUL';
            }

            // LEVEL 3: FALLBACK BERDASARKAN PREFIX NOMOR HP
            else {
                if (['0814','0815','0816','0855','0856','0857','0858','62856','62857','0895','0896','0897','0898','0899','62896','62895'].some(p => cleanHp.startsWith(p))) {
                    selectedCluster = isPaketData ? 'MOBO_PAKET' : 'MOBO_PULSA';
                } else if (['0811','0812','0813','0821','0822','0823','0851','0852','0853','62812','62821'].some(p => cleanHp.startsWith(p))) {
                    selectedCluster = 'TSEL_GIGA';
                } else if (['0817','0818','0819','0838','0831','0859','0832','0833','62838','62819'].some(p => cleanHp.startsWith(p))) {
                    selectedCluster = 'XL_DOMPUL';
                }
            }

            const clusterSelect = document.getElementById('clusterSelect');
            if (clusterSelect) {
                clusterSelect.value = selectedCluster;
            }
        }

        // FUNGSI UTAMA FETCH API KE BACKEND FLASK
        async function handleQueryValidation(e) {
            e.preventDefault();
            const billInfo = document.getElementById('billInfoInput').value.trim();
            if (!billInfo) return alert("Masukkan bill_info1 (No. HP / ID) terlebih dahulu!");

            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const originalBtnText = btnSubmit.innerHTML;
            
            btnSubmit.innerHTML = "⏳ Mengambil Data...";
            btnSubmit.disabled = true;

            try {
                const baseUrl = (typeof SERVER_URL !== 'undefined') ? SERVER_URL : 'http://localhost:5000';
                
                const response = await fetch(`${baseUrl}/api/get-bill-validation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bill_info1: billInfo })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    const data = result.data;

                    rawNominalFromDB = data.nominal || "";

                    // 1. Fill parameter form (Otomatis ubah 08.. ke 628..)
                    document.getElementById('noHpInput').value = formatPhone62(data.no_hp || billInfo);
                    document.getElementById('snInput').value = data.sn || "-";
                    document.getElementById('waktuInput').value = data.waktu || "-";
                    
                    let valProduk = "-";
                    if (data.id_produk && data.deskripsi_produk && data.id_produk !== data.deskripsi_produk) {
                        valProduk = `${data.id_produk} - ${data.deskripsi_produk}`;
                    } else {
                        valProduk = data.deskripsi_produk || data.id_produk || data.nominal || "-";
                    }
                    document.getElementById('paketInput').value = valProduk;

                    // 2. Auto-Select Cluster Kategori
                    detectAndSetCluster(
                        data.id_produk, 
                        data.deskripsi_produk, 
                        data.no_hp || billInfo, 
                        data.deskripsi_biller, 
                        data.id_biller
                    );

                    // 3. Generate Teks Validasi
                    handleGenerate();
                    
                } else {
                    alert("❌ " + (result.message || "Data transaksi tidak ditemukan!"));
                }
            } catch (err) {
                console.error("Fetch error:", err);
                alert("❌ Gagal terhubung ke server backend Python!");
            } finally {
                btnSubmit.innerHTML = originalBtnText;
                btnSubmit.disabled = false;
            }
        }

        function handleGenerate() {
            const cluster = document.getElementById('clusterSelect').value;
            const valProduk = document.getElementById('paketInput').value || "-";
            const cleanNominal = getCleanNominal(valProduk);
            const cleanDeskripsi = getCleanDeskripsi(valProduk);
            const rawHp = document.getElementById('noHpInput').value || "-";
            const formattedHp = formatPhone62(rawHp);

            const data = {
                no_hp: formattedHp,
                nominal: cleanNominal,
                sn: document.getElementById('snInput').value || "-",
                waktu: document.getElementById('waktuInput').value || "-",
                nama_paket: cleanDeskripsi
            };

            const resultText = generateMitraValidation(cluster, data);
            document.getElementById('reportResult').value = resultText;
        }

        function generateMitraValidation(cluster, data) {
            switch (cluster) {
                case "MOBO_PULSA":
                    return `Isi ulang pulsa Rp ${data.nominal} untuk No. ${data.no_hp} telah berhasil dengan SN : ${data.sn} pada ${data.waktu}`;
                case "MOBO_PAKET":
                    return `Pengisian paket ${data.nama_paket} ke IM3&Tri Pada ${data.waktu} ke ${data.no_hp} SUKSES TID:${data.sn}`;
                case "TSEL_GIGA":
                    return `${data.waktu} TELKOMSEL ${data.nominal} ${data.no_hp} ${data.sn} SUCCESS`;
                case "XL_DOMPUL":
                    return `Transaksi dgn No. ${data.sn} berhasil untuk pengisian pulsa ke ${data.no_hp} sebesar ${data.nominal}`;
                case "MANDIRI_TOLM":
                    let numVal = parseFloat(data.nominal) || 0;
                    let formattedNominal = numVal > 0 ? numVal.toFixed(2) : (data.nominal.includes('.') ? data.nominal : data.nominal + '.00');
                    return `1420089778897;IDR;${data.waktu}\n;UBP60636032900FFFFFF${data.no_hp} API CA/SA UBP PYM DR\n;UBP60636032900FFFFFF${data.no_hp} API CA/SA UBP PYM DR\n;0.00;${formattedNominal}`;
                default:
                    return ``;
            }
        }

        function copyReportText() {
            const copyText = document.getElementById("reportResult");
            if (!copyText.value) return;
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.getElementById("btnCopy");
            btn.innerText = "✅ Copied!";
            setTimeout(() => btn.innerText = "📋 Copy Text", 1500);
        }

        // FUNGSI COPY IMAGE (GENERATOR CANVAS HIGH-DPI WITH WHITE TEXT)
        async function copyReportImage() {
            const text = document.getElementById("reportResult").value;
            if (!text || text.trim() === "") {
                return alert("Belum ada teks untuk dibuat gambar!");
            }

            const btn = document.getElementById("btnCopyImg");
            const originalBtnText = btn.innerText;
            btn.innerText = "⏳ Rendering...";

            try {
                const padding = 16;
                const fontSize = 13;
                const lineHeight = 20;
                const font = "13px Consolas, Monaco, 'Courier New', monospace";
                const maxWidth = 580;

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                ctx.font = font;

                const rawLines = text.split("\n");
                let lines = [];

                rawLines.forEach(line => {
                    let words = line.split(" ");
                    let currentLine = "";
                    words.forEach(word => {
                        let testLine = currentLine ? currentLine + " " + word : word;
                        if (ctx.measureText(testLine).width > maxWidth) {
                            lines.push(currentLine);
                            currentLine = word;
                        } else {
                            currentLine = testLine;
                        }
                    });
                    if (currentLine) lines.push(currentLine);
                });

                let maxLineWidth = 0;
                lines.forEach(l => {
                    const w = ctx.measureText(l).width;
                    if (w > maxLineWidth) maxLineWidth = w;
                });

                const width = Math.max(maxLineWidth + padding * 2, 420);
                const height = lines.length * lineHeight + padding * 2;

                canvas.width = width * 2;
                canvas.height = height * 2;
                ctx.scale(2, 2);

                // Background Box
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, 0, width, height);

                // Border
                ctx.strokeStyle = "#334155";
                ctx.lineWidth = 1;
                ctx.strokeRect(0, 0, width, height);

                // Draw Text Putih Monospace
                ctx.font = font;
                ctx.fillStyle = "#ffffff";
                ctx.textBaseline = "top";

                lines.forEach((l, idx) => {
                    ctx.fillText(l, padding, padding + idx * lineHeight);
                });

                canvas.toBlob(async (blob) => {
                    if (!blob) throw new Error("Gagal membuat blob gambar!");

                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ "image/png": blob })
                        ]);
                        btn.innerText = "✅ Image Copied!";
                        setTimeout(() => btn.innerText = originalBtnText, 1500);
                    } catch (clipErr) {
                        console.error("Clipboard Error:", clipErr);
                        alert("Gagal otomatis menyalin gambar. Pastikan izin Clipboard diaktifkan di browser.");
                        btn.innerText = originalBtnText;
                    }
                }, "image/png");

            } catch (err) {
                console.error("Render Error:", err);
                alert("❌ Gagal membuat gambar: " + err.message);
                btn.innerText = originalBtnText;
            }
        }

        // Init Default Waktu
        setCurrentTime();
    </script>

    <!-- INJEKSI SIDEBAR & BOTTOM BAR -->
    <script src="sidebarv2.js"></script>
</body>
</html>
