<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOMSDAY - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <!-- LAYER CYBER GRID -->
    <div class="cyber-bg" id="cyberBg"></div>

    <!-- ANIMASI DETAK JANTUNG MONITOR (ECG PULSE LINE) -->
    <div class="ecg-container">
        <svg class="ecg-svg" viewBox="0 0 1200 180" preserveAspectRatio="none">
            <path class="ecg-path" d="M0,90 L200,90 L210,80 L215,90 L225,90 L235,30 L245,150 L255,70 L265,100 L275,90 L300,90 L600,90 L610,80 L615,90 L625,90 L635,30 L645,150 L655,70 L665,100 L675,90 L700,90 L1000,90 L1010,80 L1015,90 L1025,90 L1035,30 L1045,150 L1055,70 L1065,100 L1075,90 L1200,90" />
        </svg>
    </div>

    <!-- KARTU LOGIN GLASSMORPHISM -->
    <div class="login-card" id="loginCard">
        <div class="scanline"></div>
        <h2 id="loginTitle">DOOMSDAY</h2>
        <p id="loginSub">AUTENTIKASI SISTEM TINGKAT LINGKUNGAN</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" id="groupUser">
                <label for="username">USERNAME PIC</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="MASUKKAN USERNAME..." 
                    required 
                    autocomplete="off"
                    oninput="this.value = this.value.toUpperCase()"
                >
            </div>

            <div class="form-group" id="groupPass">
                <label for="password">PASSWORD</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="MASUKKAN PASSWORD..." required>
                    <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Tampilkan password">🙉</button>
                </div>
                <div id="capslockWarning" class="capslock-warning" aria-live="polite">⚠️ Caps Lock Aktif</div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">MASUK SEKARANG 🚀</button>
            <div id="errorMsg" class="error-msg">Username atau Password salah!</div>
        </form>

        <div class="server-status-box" id="statusBox">
            <div class="status-info">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText" style="color: #94a3b8;">Mengecek Server...</span>
            </div>
            <button type="button" id="btnRefreshServer" class="btn-refresh-server" onclick="checkServerStatus()" title="Cek ulang koneksi server">
                ⟳
            </button>
        </div>
    </div>

    <script>
        const CASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0Kd5FEaK0lFx1A5TdNfyCqtYH_GZgeKbGy9vuNi2S-WouNgDmWF7kFDmX06y3IwW_Sw/exec";
        let SERVER_URL = "http://localhost:5000";

        async function initServerUrl() {
            try {
                const res = await fetch(`${CASE_SCRIPT_URL}?action=get_server_url`);
                const data = await res.json();
                if (data.status === "success" && data.server_url) {
                    SERVER_URL = data.server_url;
                    console.log("🌐 Dynamic SERVER_URL Terhubung:", SERVER_URL);
                }
            } catch (err) {
                console.warn("⚠️ Gagal mengambil Dynamic SERVER_URL, memakai fallback localhost.");
            }
        }

        async function checkServerStatus() {
            const dot = document.getElementById("statusDot");
            const text = document.getElementById("statusText");
            const btn = document.getElementById("btnRefreshServer");

            btn.classList.add("spin");
            text.innerText = "Mengecek...";
            text.style.color = "#94a3b8";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(`${SERVER_URL}/api/status`, {
                    method: "GET",
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    dot.className = "status-dot online";
                    text.innerText = "Server Online 🟢";
                    text.style.color = "#00ff66";
                } else {
                    throw new Error("Server Error");
                }
            } catch (err) {
                dot.className = "status-dot";
                text.innerText = "Server Offline 🔴";
                text.style.color = "#ef4444";
            } finally {
                btn.classList.remove("spin");
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const toggleBtn = document.getElementById("togglePasswordBtn");
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            toggleBtn.textContent = isHidden ? "🙈" : "🙉";
            toggleBtn.setAttribute("aria-label", isHidden ? "Sembunyikan password" : "Tampilkan password");
        }

        function updateCapsLockWarning(event) {
            const warning = document.getElementById("capslockWarning");
            if (!event || typeof event.getModifierState !== "function") return;

            const isCapsOn = event.getModifierState("CapsLock");
            warning.classList.toggle("show", isCapsOn);
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById("username").value.trim().toUpperCase();
            const pass = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");
            const btnLogin = document.getElementById("btnLogin");

            const loginCard = document.getElementById("loginCard");
            const loginTitle = document.getElementById("loginTitle");
            const loginSub = document.getElementById("loginSub");
            const groupUser = document.getElementById("groupUser");
            const groupPass = document.getElementById("groupPass");
            const statusBox = document.getElementById("statusBox");

            errorMsg.style.display = "none";
            btnLogin.innerText = "VERIFIKASI SISTEM...";
            btnLogin.disabled = true;

            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem("loggedInUser", user);
                    
                    loginCard.classList.add("shatter");
                    loginTitle.classList.add("scatter-title");
                    loginSub.classList.add("scatter-title");
                    groupUser.classList.add("scatter-user");
                    groupPass.classList.add("scatter-pass");
                    btnLogin.classList.add("scatter-btn");
                    statusBox.classList.add("scatter-status");
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1700);
                } else {
                    errorMsg.innerText = data.message || "Username atau Password salah!";
                    errorMsg.style.display = "block";
                    btnLogin.innerText = "MASUK SEKARANG 🚀";
                    btnLogin.disabled = false;
                }
            } catch (err) {
                errorMsg.innerText = "Gagal terhubung ke Server Laptop!";
                errorMsg.style.display = "block";
                btnLogin.innerText = "MASUK SEKARANG 🚀";
                btnLogin.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const passwordInput = document.getElementById("password");
            const toggleBtn = document.getElementById("togglePasswordBtn");
            const warning = document.getElementById("capslockWarning");

            toggleBtn.addEventListener("click", togglePasswordVisibility);
            passwordInput.addEventListener("keydown", updateCapsLockWarning);
            passwordInput.addEventListener("keyup", updateCapsLockWarning);
            passwordInput.addEventListener("blur", () => warning.classList.remove("show"));

            await initServerUrl(); 
            checkServerStatus();   

            if (sessionStorage.getItem("loggedInUser")) {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
